[platformio]
src_dir = .

[env:esp32c5]
; pioarduino fork required for ESP32-C5 Arduino support
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c5-devkitc-1
framework = arduino
build_src_filter = +<app.cpp>

upload_port = COM20
monitor_port = COM20
monitor_speed = 115200
board_build.f_cpu = 240000000L

; Route Serial (USB-CDC) to the native USB port so Serial.print() shows in the monitor.
; The ESP32-C5 has a built-in USB-Serial/JTAG peripheral.
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=3   ; 0=none 1=error 2=warn 3=info 4=debug 5=verbose

lib_deps =
  adafruit/Adafruit NeoPixel @ ^1.12.3
  mathieucarbou/AsyncTCP @ ^3.3.2
  https://github.com/mathieucarbou/ESPAsyncWebServer.git @ ^3.6.0
